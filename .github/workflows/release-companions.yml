name: Build & Publish Offline Companion APKs (Lumina, StepQuest, Aura Live)

on:
  push:
    tags:
      - "companions-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name"
        required: true
        default: "companions-v2.0.0"

permissions:
  contents: write

jobs:
  build-lumina:
    name: Build Lumina Terrarium v2 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass newww2026offline -keypass newww2026offline \
            -dname "CN=Newww Companions, OU=OfflineAI, O=Newww, L=Paris, ST=IDF, C=FR"
      - name: Test & Assemble Lumina Terrarium Release APK
        working-directory: lumina-terrarium
        env:
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v2.0.0}"
          gradle testDebugUnitTest assembleRelease --no-daemon --console=plain
          OUT="/tmp/Lumina-Terrarium-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-terrarium-apk
          path: ${{ env.APK_PATH }}

  build-stepquest:
    name: Build StepQuest Companion v2 APK (Gemma-3 1B + RPG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Install Android NDK 27.3 & CMake 3.22
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Fetch Embedded Offline AI Models (StepQuest)
        run: bash scripts/fetch_companions_ai.sh stepquest
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass newww2026offline -keypass newww2026offline \
            -dname "CN=Newww Companions, OU=OfflineAI, O=Newww, L=Paris, ST=IDF, C=FR"
      - name: Test & Assemble StepQuest Release APK
        working-directory: stepquest-companion
        env:
          LLAMA_CPP_DIR: /tmp/offline-ai-cache/llama.cpp
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v2.0.0}"
          gradle :app:testDebugUnitTest -x externalNativeBuildDebug -x mergeDebugAssets --no-daemon --console=plain
          gradle assembleRelease --no-daemon --console=plain
          OUT="/tmp/StepQuest-Companion-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: stepquest-companion-apk
          path: ${{ env.APK_PATH }}

  build-aura:
    name: Build Aura Live v2 Mimico APK (Llama-3.2 3B + Photo LivePortrait + Voice FR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Install Android NDK 27.3 & CMake 3.22
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Fetch Embedded Offline AI Models (Aura Live v2)
        run: bash scripts/fetch_companions_ai.sh aura
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass newww2026offline -keypass newww2026offline \
            -dname "CN=Newww Companions, OU=OfflineAI, O=Newww, L=Paris, ST=IDF, C=FR"
      - name: Test & Assemble Aura Live Release APK
        working-directory: aura-companion
        env:
          LLAMA_CPP_DIR: /tmp/offline-ai-cache/llama.cpp
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v2.0.0}"
          gradle :app:testDebugUnitTest -x externalNativeBuildDebug -x mergeDebugAssets --no-daemon --console=plain
          gradle assembleRelease --no-daemon --console=plain
          OUT="/tmp/Aura-Live-Companion-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-companion-apk
          path: ${{ env.APK_PATH }}

  publish-companions-release:
    name: Publish GitHub Release with Direct Download Links (3 Offline APKs v2)
    needs: [build-lumina, build-stepquest, build-aura]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumina-terrarium-apk
          path: /tmp/release-companions
      - uses: actions/download-artifact@v4
        with:
          name: stepquest-companion-apk
          path: /tmp/release-companions
      - uses: actions/download-artifact@v4
        with:
          name: aura-companion-apk
          path: /tmp/release-companions
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v2.0.0}"
          APK_L="/tmp/release-companions/Lumina-Terrarium-${TAG}.apk"
          APK_S="/tmp/release-companions/StepQuest-Companion-${TAG}-arm64.apk"
          APK_A="/tmp/release-companions/Aura-Live-Companion-${TAG}-arm64.apk"
          ls -lh /tmp/release-companions/
          SHA_L=$(sha256sum "$APK_L" | awk '{print $1}')
          SHA_S=$(sha256sum "$APK_S" | awk '{print $1}')
          SHA_A=$(sha256sum "$APK_A" | awk '{print $1}')
          cat > /tmp/companions-notes.md <<EOF
          ## 3 Applications Android Compagnons Virtuels 100 % Hors-Ligne — ${TAG} (Refonte Majeure v2.0)

          **Tout est intégré directement dans chaque APK** : zéro téléchargement après installation.

          ### 1. Lumina Terrarium v2.0 (\`Lumina-Terrarium-${TAG}.apk\`)
          - **Podomètre automatique de la journée corrigé** : persistance du compteur matériel + epoch de boot + \`flush()\` FIFO + ré-enregistrement immédiat après autorisation (récupère tes pas même quand l'app était fermée) + graphique 7 jours.
          - **Design & interactivité enrichis** : verre multi-couches + strates botaniques, esprit qui se promène librement dans le bocal, **buée interactive à essuyer au doigt**, **décorations déplaçables au doigt (16 décors, 6 bocaux)**, **4 teintes de lampe**, **3 mini-jeux jouables** (*Chasse aux Lucioles*, *Pluie d'Étoiles*, *Carillon Mémoire*), audio PCM et **Widget Android**.
          - **SHA-256** : \`$SHA_L\`

          ### 2. StepQuest Companion v2.0 (\`StepQuest-Companion-${TAG}-arm64.apk\`)
          - **Podomètre automatique de toute la journée corrigé** + paliers quotidiens (1k/3k/6k/10k pas) + graphique 7 jours.
          - **Gameplay RPG vivant** : carte 60 FPS interactive avec **coffres/trésors cliquables**, **4 familiers animaux** marchant avec ton héros (*Renard, Hibou, Luciole, Louveteau*), **Rencontres Interactives RPG à 3 choix**, **Atelier de fabrication (Craft)** d'élixirs/festins/cartes.
          - **IA Locale multi-tours corrigée** : \`Gemma-3 1B Q4_K_M\` intégré en vrai format multi-tours pour des discussions précises et des lettres du soir sur mesure.
          - **SHA-256** : \`$SHA_S\`

          ### 3. Aura Live Companion v2.0 — Édition Mimico (\`Aura-Live-Companion-${TAG}-arm64.apk\`)
          - **Voix Neurales FR réparées & instantanées** : extraction éclair via \`espeak-ng-data.zip\` (< 0,3 s), 3 voix Piper VITS FR (*Siwis*, *Jessica*, *Pierre*) + drain AudioTrack complet + secours Android TTS immédiat + **Lip-Sync double visème (ouverture RMS + largeur voyelles ZCR)**.
          - **Vrai cerveau IA 3 Milliards de paramètres (\`Llama-3.2-3B-Instruct-IQ3_M\`)** : format multi-tours natif, répond directement et intelligemment en français sans jamais partir à côté.
          - **Auto-Adaptation & Auto-Mémoire Mimico** : les infos que tu donnes dans la conversation (prénom, surnom, tutoiement/vouvoiement, caractère plus drôle/doux/romantique/court, ville, métier, goûts, animaux…) mettent à jour tes réglages et ta mémoire **toutes seules** avec notification discrète !
          - **Photo Animée par IA ultra-vivante (LivePortrait v2)** : maillage 32×32 sur 478 points MediaPipe, **paupières teintées sur la vraie peau de ta photo**, micro-saccades du regard, Lip-Sync prononcé avec lueur dentaire, mouvements de tête 2.5D, curseurs d'intensité en direct, **10 filtres cinéma** et **10 décors IA**.
          - **Interface plein écran style Mimico** : portrait edge-to-edge + chat verre givré flottant + mode Plein Écran 1-tap, **8 profils prêts** (+ création illimitée), **10 thèmes**, **4 styles de bulles**, **7 scénarios / jeux de rôle**, et ambiances sonores PCM.
          - **SHA-256** : \`$SHA_A\`
          EOF
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "$APK_L" \
            "$APK_S" \
            "$APK_A" \
            --repo "${{ github.repository }}" \
            --title "${TAG} — Lumina v2, StepQuest v2 & Aura Live v2 Mimico (3 APK 100 % Hors-Ligne)" \
            --notes-file /tmp/companions-notes.md
