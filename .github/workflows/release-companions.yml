name: Build & Publish Offline Companion APKs (Lumina, StepQuest, Aura Live)

on:
  push:
    tags:
      - "companions-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name"
        required: true
        default: "companions-v1.0.0"

permissions:
  contents: write

jobs:
  build-lumina:
    name: Build Lumina Terrarium APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass newww2026offline -keypass newww2026offline \
            -dname "CN=Newww Companions, OU=OfflineAI, O=Newww, L=Paris, ST=IDF, C=FR"
      - name: Test & Assemble Lumina Terrarium Release APK
        working-directory: lumina-terrarium
        env:
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v1.0.0}"
          gradle testDebugUnitTest assembleRelease --no-daemon --console=plain
          OUT="/tmp/Lumina-Terrarium-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-terrarium-apk
          path: ${{ env.APK_PATH }}

  build-stepquest:
    name: Build StepQuest Companion APK (Bundled Gemma-3 1B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Install Android NDK 27.3 & CMake 3.22
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Fetch Embedded Offline AI Models (StepQuest)
        run: bash scripts/fetch_companions_ai.sh stepquest
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass newww2026offline -keypass newww2026offline \
            -dname "CN=Newww Companions, OU=OfflineAI, O=Newww, L=Paris, ST=IDF, C=FR"
      - name: Test & Assemble StepQuest Release APK
        working-directory: stepquest-companion
        env:
          LLAMA_CPP_DIR: /tmp/offline-ai-cache/llama.cpp
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v1.0.0}"
          gradle :app:testDebugUnitTest -x externalNativeBuildDebug -x mergeDebugAssets --no-daemon --console=plain
          gradle assembleRelease --no-daemon --console=plain
          OUT="/tmp/StepQuest-Companion-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: stepquest-companion-apk
          path: ${{ env.APK_PATH }}

  build-aura:
    name: Build Aura Live Companion APK (Photo AI + Voice FR + Gemma-3 1B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Install Android NDK 27.3 & CMake 3.22
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Fetch Embedded Offline AI Models (Aura Live)
        run: bash scripts/fetch_companions_ai.sh aura
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass newww2026offline -keypass newww2026offline \
            -dname "CN=Newww Companions, OU=OfflineAI, O=Newww, L=Paris, ST=IDF, C=FR"
      - name: Test & Assemble Aura Live Release APK
        working-directory: aura-companion
        env:
          LLAMA_CPP_DIR: /tmp/offline-ai-cache/llama.cpp
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v1.0.0}"
          gradle :app:testDebugUnitTest -x externalNativeBuildDebug -x mergeDebugAssets --no-daemon --console=plain
          gradle assembleRelease --no-daemon --console=plain
          OUT="/tmp/Aura-Live-Companion-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-companion-apk
          path: ${{ env.APK_PATH }}

  publish-companions-release:
    name: Publish GitHub Release with Direct Download Links (3 Offline APKs)
    needs: [build-lumina, build-stepquest, build-aura]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumina-terrarium-apk
          path: /tmp/release-companions
      - uses: actions/download-artifact@v4
        with:
          name: stepquest-companion-apk
          path: /tmp/release-companions
      - uses: actions/download-artifact@v4
        with:
          name: aura-companion-apk
          path: /tmp/release-companions
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-companions-v1.0.0}"
          APK_L="/tmp/release-companions/Lumina-Terrarium-${TAG}.apk"
          APK_S="/tmp/release-companions/StepQuest-Companion-${TAG}-arm64.apk"
          APK_A="/tmp/release-companions/Aura-Live-Companion-${TAG}-arm64.apk"
          ls -lh /tmp/release-companions/
          SHA_L=$(sha256sum "$APK_L" | awk '{print $1}')
          SHA_S=$(sha256sum "$APK_S" | awk '{print $1}')
          SHA_A=$(sha256sum "$APK_A" | awk '{print $1}')
          cat > /tmp/companions-notes.md <<EOF
          ## 3 Applications Android Compagnons Virtuels 100 % Hors-Ligne — ${TAG}

          **Tout est intégré directement dans chaque APK** : zéro téléchargement supplémentaire après l'installation, fonctionnement 100 % hors-ligne.

          ### 1. Lumina Terrarium (\`Lumina-Terrarium-${TAG}.apk\`)
          - **4 Esprits Élémentaires évolutifs** (4 stades) : *Sylva* (mousse), *Ondine* (eau), *Braise* (flamme), *Nimbo* (nuage).
          - **Terrarium 60 FPS interactif** : caresses, tapotements sur le verre, suivi du regard, inclinaison accéléromètre, mini-jeu *Chasse aux Lucioles*.
          - **Capteurs locaux** : batterie (sieste < 20 %, charge lumineuse), podomètre → Rosée, cycle jour/nuit réel, synthétiseur d'ambiances PCM, **Widget d'écran d'accueil Android** interactif et rappels locaux.
          - **SHA-256** : \`$SHA_L\`

          ### 2. StepQuest Companion (\`StepQuest-Companion-${TAG}-arm64.apk\`)
          - **Expédition RPG au podomètre réel** dans **7 biomes fantastiques** animés à 60 FPS + **14 reliques** à collectionner.
          - **Routine Matin / Midi / Soir** : préparation du sac (3 équipements sur 8), provisions & feu de camp, lettres de voyage personnalisées.
          - **IA locale intégrée dans l'APK** : \`llama.cpp\` ARM64 + **\`Gemma-3 1B Instruct Q4_K_M\`** pour les lettres du soir et le chat libre au feu de camp.
          - **SHA-256** : \`$SHA_S\`

          ### 3. Aura Live Companion (\`Aura-Live-Companion-${TAG}-arm64.apk\`)
          - **Animation d'une PHOTO par IA locale** : importe une photo de ta galerie → **MediaPipe Face Landmarker (478 points)** + **Selfie Segmenter** créent un maillage 60 FPS (clignement, expressions, rougissement, respiration 2.5D, filtres, changement de décor IA & **Lip-Sync vocal exact**).
          - **Studio Avatar au chargement** : 4 styles (*Anime Live2D, Semi-Réaliste, Chibi, Cyber Néon*), 8 coiffures avec physique, 6 tenues, 6 accessoires, 6 décors animés & **5 thèmes d'interface**.
          - **Multi-personnages & Caractère 100 % configurable** : 5 personnalités prêtes (*Clara, Sora, Élena, Mina, Kira*) + création illimitée, 8 curseurs de caractère, backstory, règles libres et mémoire long-terme éditable.
          - **IA Vocale & Cerveau 100 % intégrés** : \`Gemma-3 1B Q4_K_M\` (\`llama.cpp\`) + **Whisper-Tiny INT8 FR** (micro / appel continu) + **Piper VITS FR 3 voix neurales** (*Siwis, Jessica, Pierre*, vitesse & timbre réglables).
          - **SHA-256** : \`$SHA_A\`
          EOF
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "$APK_L" \
            "$APK_S" \
            "$APK_A" \
            --repo "${{ github.repository }}" \
            --title "${TAG} — Lumina Terrarium, StepQuest & Aura Live (3 APK 100 % Hors-Ligne)" \
            --notes-file /tmp/companions-notes.md
