name: Build & Publish Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-astropro:
    name: Build AstroPro 14U APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Install Android NDK 27.3 & CMake 3.22
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Run Native C++20 Astro Engine Unit Tests
        run: |
          g++ -O2 -std=c++20 -Wall -Wextra -Wno-unused-parameter \
            astropro-14u/app/src/main/cpp/raw_demosaic.cpp \
            astropro-14u/app/src/main/cpp/star_engine.cpp \
            astropro-14u/app/src/main/cpp/stacker_engine.cpp \
            astropro-14u/app/src/main/cpp/astro_lab.cpp \
            astropro-14u/app/src/main/cpp/astro_io.cpp \
            astropro-14u/app/src/main/cpp/tests/test_astro_engine.cpp \
            -Iastropro-14u/app/src/main/cpp -o /tmp/test_astro && /tmp/test_astro

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass astrocoach2026 -keypass astrocoach2026 \
            -dname "CN=Newww Mobile, OU=Engineering, O=Newww, L=Paris, ST=IDF, C=FR"

      - name: Test & Assemble AstroPro 14U Release APK
        working-directory: astropro-14u
        env:
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-v1.1.0}"
          gradle testDebugUnitTest assembleRelease --no-daemon --console=plain
          OUT="/tmp/AstroPro-14U-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: astropro-14u-apk
          path: ${{ env.APK_PATH }}

  build-kinetix:
    name: Build KINETIX Coach APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Install Android NDK 27.3 & CMake 3.22
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Fetch llama.cpp & Embedded Offline AI Models
        run: |
          mkdir -p /tmp/model-cache kinetix-coach/app/src/main/assets/models
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/model-cache/llama.cpp
          curl -fSL -o kinetix-coach/app/src/main/assets/models/pose_landmarker_full.task \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task"
          curl -fSL -o kinetix-coach/app/src/main/assets/models/gemma-3-1b-it-Q4_K_M.gguf \
            "https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf"
          ls -lh kinetix-coach/app/src/main/assets/models/
          echo "Bundled MP4 videos: $(ls kinetix-coach/app/src/main/assets/videos/*.mp4 | wc -l)"

      - name: Verify Knowledge Base & Generate Release Keystore
        run: |
          python3 kinetix-coach/scripts/verify_knowledge_base.py
          keytool -genkeypair -v -keystore /tmp/release.keystore -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass astrocoach2026 -keypass astrocoach2026 \
            -dname "CN=Newww Mobile, OU=Engineering, O=Newww, L=Paris, ST=IDF, C=FR"

      - name: Test & Assemble KINETIX Coach Release APK
        working-directory: kinetix-coach
        env:
          LLAMA_CPP_DIR: /tmp/model-cache/llama.cpp
          RELEASE_KEYSTORE_PATH: /tmp/release.keystore
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-v1.1.0}"
          gradle :app:testDebugUnitTest -x externalNativeBuildDebug -x mergeDebugAssets --no-daemon --console=plain
          gradle assembleRelease --no-daemon --console=plain
          OUT="/tmp/Kinetix-Coach-${TAG}-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kinetix-coach-apk
          path: ${{ env.APK_PATH }}

  publish-release:
    name: Publish GitHub Release with Direct APK Links
    needs: [build-astropro, build-kinetix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astropro-14u-apk
          path: /tmp/release-apks

      - uses: actions/download-artifact@v4
        with:
          name: kinetix-coach-apk
          path: /tmp/release-apks

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          TAG="${TAG:-v2.2.0}"
          APK_K="/tmp/release-apks/Kinetix-Coach-${TAG}-arm64.apk"
          APK_A="/tmp/release-apks/AstroPro-14U-${TAG}-arm64.apk"
          ls -lh /tmp/release-apks/
          SHA_K=$(sha256sum "$APK_K" | awk '{print $1}')
          SHA_A=$(sha256sum "$APK_A" | awk '{print $1}')
          cat > /tmp/release-notes.md <<EOF
          ## 2 Applications Android 100 % Hors-Ligne Prêtes à Installer — ${TAG} (ARM64 / Android 10+)

          ### 1. KINETIX Coach v2.0.0 (\`Kinetix-Coach-${TAG}-arm64.apk\`)
          - **Moteur Anti-Glitch de Détection & Stabilité Pro (45/45 tests)** :
            - **Filtre physique anti-téléportation & maintien sur occlusion (\`PoseSanityFilter\`)** + garde automatique de déplacement / repositionnement (*« Stabilisation… »*) bloquant les fausses répétitions et faux changements d'exercice quand tu marches ou touches le téléphone.
            - **Auto-détection d'exercice blindée (\`AutoExerciseDetector\`)** : fin des faux *Burpees* en t'allongeant/te relevant (cycle complet aller-retour exigé), fin du clignotement *Pompes ↔ Planche* pendant une pause en haut (délai \`3,2 s\` immobile requis), verrouillage asymétrique en série active, cooldown \`2,8 s\`, changement fluide sans saut du squelette + **cadenas 1-tap** pour épingler instantanément l'exercice détecté.
            - **Hystérésis \`±6°\` sur l'angle caméra (\`CameraViewpointTracker\`)**, garde physique de posture (impossible de compter des pompes debout ou des squats allongé), et garde de durée minimale de répétition (\`≥ 360 ms\`).
          - **Optimisation Pro 60 FPS & Ergonomie** : \`ImageAnalysis\` ciblé \`640×480\`, \`PreviewView\` matériel \`PERFORMANCE\`, tampon Bitmap réutilisable **zéro GC**, garde backpressure, correction du miroir caméra frontale (repères 3D anatomiques vrais), synchronisation thread-safe (\`pipelineLock\`), flux squelette isolé haute fréquence, **\`FLAG_KEEP_SCREEN_ON\`** automatique en Vision et pause audio propre sur \`ON_PAUSE\`.
          - **Tout l'écosystème inclus** : Pompes 6 variantes + audit 16 exos (\`Adaptatif\`/\`Strict\`), **7 Défis caméra** (*Bip & Go*, *Luc Léger*, *Gainage Musical*, *25/50/100 Reps*, *AMRAP*, *Tabata*, *EMOM*) + 4 musiques synthétisées + **import MP3 local**, calories personnalisées, **42 vidéos biomécaniques MP4**, **LLM local \`Gemma-3 1B Q4_K_M\`** + **2 683 fiches SQLite FTS5**.
          - **SHA-256** : \`$SHA_K\`

          ### 2. AstroPro 14U v2.0.0 (\`AstroPro-14U-${TAG}-arm64.apk\`)
          - **Auto-Focus Étoiles (Courbe en V)** + infini mémorisé par objectif (\`12 / 23 / 75 / 120 mm\`), **AR Sky Overlay** (toggle \`AR\`), **Paysage + Ciel Séparé 100 % Auto**, **Mode HDR Astro (\`3 EV / 5 EV\`)**, **Drizzle 2×**, **Déconvolution Richardson-Lucy & Anti-Aberration Chromatique automatiques**, **Garde Anti-Vibration / Vent** et **Pipeline Post-Capture Zéro Effort**.
          - **SHA-256** : \`$SHA_A\`
          EOF
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes || true
          gh release create "$TAG" \
            "$APK_K" \
            "$APK_A" \
            --repo "${{ github.repository }}" \
            --title "${TAG} — KINETIX Coach v2.0 Pro (Détection Anti-Glitch & 60 FPS) & AstroPro 14U v2.0" \
            --notes-file /tmp/release-notes.md
